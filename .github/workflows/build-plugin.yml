name: Build and Deploy QGIS Plugin

on:
  push:
    branches-ignore:
      - pre-commit-fixes
    tags:
      - 'v*'
  pull_request:
    branches-ignore:
      - pre-commit-fixes

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Format code base
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: pre-commit/action@v3.0.1
        continue-on-error: true

      - name: Create PR for pre-commit fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT }}
          branch: pre-commit-fixes
          base: main
          commit-message: "Automated formatting corrections [skip ci]"
          title: "Automated formatting corrections"
          body: "Auto-generated PR containing pre-commit fixes."

      - name: Ensure clean git working directory
        run: git checkout -- .

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests qgis-plugin-ci

      - name: Run tests
        run: python -m pytest tests/ -v

      # "latest" = newest version in CHANGELOG.md; the release job uses the tag
      - name: Package the QGIS plugin
        run: qgis-plugin-ci package latest

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: '*.zip'
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install qgis-plugin-ci
        run: python -m pip install qgis-plugin-ci

      - name: Create GitHub Release from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          qgis-plugin-ci changelog "$VERSION" > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No '## [$VERSION] - YYYY-MM-DD' section in CHANGELOG.md"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release_notes.md

      # Builds the ZIP from the tag, attaches it to the GitHub Release and,
      # when the QGIS_PLUGIN_TOKEN secret is set, publishes it on plugins.qgis.org
      - name: Publish the plugin
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARGS=(--release-tag "$GITHUB_REF_NAME" --github-token "$GH_TOKEN")
          if [ -n "$QGIS_PLUGIN_TOKEN" ]; then
            ARGS+=(--qgis-token "$QGIS_PLUGIN_TOKEN")
          else
            echo "::warning::QGIS_PLUGIN_TOKEN secret not set: skipping upload to plugins.qgis.org"
          fi
          qgis-plugin-ci release "$VERSION" "${ARGS[@]}"
