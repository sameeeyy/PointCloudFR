name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# A new push on the same branch/PR cancels the previous run (never for tags)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    name: Lint & security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Same checks as the plugins.qgis.org scan: Bandit, detect-secrets,
      # Flake8, file permissions; plus formatting (see .pre-commit-config.yaml)
      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure --color always

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pytest requests

      - name: Run tests
        run: python -m pytest tests/ -v

  package:
    name: Package
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install qgis-plugin-ci
        run: python -m pip install "qgis-plugin-ci>=2.11,<3"

      # "latest" = newest version in CHANGELOG.md; the release job uses the tag
      - name: Package the QGIS plugin
        run: qgis-plugin-ci package latest

      # plugins.qgis.org flags hidden and compiled files
      - name: Check ZIP contents
        run: |
          unzip -Z1 ./*.zip
          if unzip -Z1 ./*.zip | grep -E '(^|/)\.|__pycache__|\.py[co]$'; then
            echo "::error::Hidden or compiled files found in the plugin ZIP"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: '*.zip'
          if-no-files-found: error

  release:
    name: Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install qgis-plugin-ci
        run: python -m pip install "qgis-plugin-ci>=2.11,<3"

      - name: Create GitHub Release from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          qgis-plugin-ci changelog "$VERSION" > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No '## [$VERSION] - YYYY-MM-DD' section in CHANGELOG.md"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release_notes.md

      # Builds the ZIP from the tag, attaches it to the GitHub Release and,
      # when the QGIS_PLUGIN_TOKEN secret is set, publishes it on plugins.qgis.org
      - name: Publish the plugin
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARGS=(--release-tag "$GITHUB_REF_NAME" --github-token "$GH_TOKEN")
          if [ -n "$QGIS_PLUGIN_TOKEN" ]; then
            ARGS+=(--qgis-token "$QGIS_PLUGIN_TOKEN")
          else
            echo "::warning::QGIS_PLUGIN_TOKEN secret not set: skipping upload to plugins.qgis.org"
          fi
          qgis-plugin-ci release "$VERSION" "${ARGS[@]}"
