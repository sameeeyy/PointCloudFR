name: Build and Deploy QGIS Plugin

on:
  push:
    branches-ignore:
      - pre-commit-fixes
    tags:
      - 'v*'
  pull_request:
    branches-ignore:
      - pre-commit-fixes

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Format code base
        uses: pre-commit/action@v3.0.1
        continue-on-error: true

      - name: Create PR for pre-commit fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT }}
          branch: pre-commit-fixes
          base: main
          commit-message: "Automated formatting corrections [skip ci]"
          title: "Automated formatting corrections"
          body: "Auto-generated PR containing pre-commit fixes."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools_scm pytest requests

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build the QGIS plugin
        run: python setup.py build -u -d dist .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/*.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-zip
          path: dist/

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Le tag est de la forme v2.2.4, on extrait la version sans le "v"
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          echo "Extracting changelog for version: $VERSION"

          # Extraction directe du bloc de version vers release_notes.txt
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.txt

          # Si aucune section n'a été trouvée (fichier vide)
          if [ ! -s release_notes.txt ]; then
            echo "⚠️ Aucune section trouvée dans CHANGELOG.md pour la version $VERSION"
            echo "Voir [CHANGELOG.md](CHANGELOG.md) pour le détail des changements." > release_notes.txt
          fi

          echo "Contenu extrait :"
          cat release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: release_notes.txt
          fail_on_unmatched_files: true
